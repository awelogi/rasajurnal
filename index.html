const MONTHS_ID = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const DAYS_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

function pad2(n){ return String(n).padStart(2,'0'); }
function toISODate(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function todayISO(){ return toISODate(new Date()); }
function parseISODate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtLong(dateISO){
  const d = parseISODate(dateISO);
  return `${DAYS_ID[d.getDay()]}, ${d.getDate()} ${MONTHS_ID[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtShort(dateISO){
  const d = parseISODate(dateISO);
  return `${d.getDate()} ${MONTHS_ID[d.getMonth()].slice(0,3)} ${d.getFullYear()}`;
}
function uid(){ return 'e_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function wordCount(s){ return (s || '').trim().split(/\s+/).filter(Boolean).length; }
function addDays(dateISO, n){ const d = parseISODate(dateISO); d.setDate(d.getDate()+n); return toISODate(d); }
function daysBetween(aISO, bISO){ return Math.round((parseISODate(bISO) - parseISODate(aISO)) / 86400000); }

function getQuarter(monthIdx){ return Math.floor(monthIdx/3)+1; }
function quarterMonths(q){ return [(q-1)*3, (q-1)*3+2]; }
function halfMonths(h){ return h === 1 ? [0,5] : [6,11]; }

function periodKey(p){
  if (p.type==='monthly') return `monthly-${p.year}-${pad2(p.month+1)}`;
  if (p.type==='quarterly') return `quarterly-${p.year}-Q${p.quarter}`;
  if (p.type==='half') return `half-${p.year}-H${p.half}`;
  return `yearly-${p.year}`;
}
function periodLabel(p){
  if (p.type==='monthly') return `${MONTHS_ID[p.month]} ${p.year}`;
  if (p.type==='quarterly') return `Kuartal ${p.quarter} ${p.year} (${MONTHS_ID[quarterMonths(p.quarter)[0]]}–${MONTHS_ID[quarterMonths(p.quarter)[1]]})`;
  if (p.type==='half') return `Semester ${p.half} ${p.year} (${MONTHS_ID[halfMonths(p.half)[0]]}–${MONTHS_ID[halfMonths(p.half)[1]]})`;
  return `Tahun ${p.year}`;
}
function inPeriod(dateISO, p){
  const d = parseISODate(dateISO);
  if (d.getFullYear() !== p.year) return false;
  const m = d.getMonth();
  if (p.type==='monthly') return m === p.month;
  if (p.type==='quarterly'){ const [a,b] = quarterMonths(p.quarter); return m>=a && m<=b; }
  if (p.type==='half'){ const [a,b] = halfMonths(p.half); return m>=a && m<=b; }
  return true;
}

function currentStreak(dateSet){
  const t = todayISO();
  let start = dateSet.has(t) ? t : (dateSet.has(addDays(t,-1)) ? addDays(t,-1) : null);
  if (!start) return 0;
  let count = 0, cursor = start;
  while (dateSet.has(cursor)){ count++; cursor = addDays(cursor,-1); }
  return count;
}
function longestStreak(dates){
  if (!dates.length) return 0;
  const sorted = [...dates].sort();
  let best = 1, run = 1;
  for (let i=1;i<sorted.length;i++){
    if (daysBetween(sorted[i-1], sorted[i]) === 1) run++;
    else run = 1;
    if (run > best) best = run;
  }
  return best;
}

function MoodPicker({ value, onChange, color }){

        <button

    </div>
  );
}

function TagInput({ tags, setTags, suggestions, color }){
  const [input, setInput] = useState('');
  const add = (raw) => {
    const t = raw.trim().replace(/^#/, '');
    if (t && !tags.includes(t)) setTags([...tags, t]);
    setInput('');
  };
  return (
    <div className="tag-input" style={{ '--field-color': color }}>
      <div className="tag-chips">
        {tags.map(t => (
          <span className="tag-chip" key={t}>
            #{t}
            <button type="button" onClick={()=>setTags(tags.filter(x=>x!==t))} aria-label={`Hapus tag ${t}`}><X size={11}/></button>
          </span>
        ))}
        <input
          value={input}
          placeholder={tags.length ? 'Tambah tag…' : 'Tambah tag, tekan Enter'}
          onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{
            if (e.key==='Enter'){ e.preventDefault(); add(input); }
            if (e.key==='Backspace' && !input && tags.length){ setTags(tags.slice(0,-1)); }
          }}
          list="tag-suggestions"
        />
        <datalist id="tag-suggestions">
          {suggestions.map(s => <option value={s} key={s} />)}
        </datalist>
      </div>
    </div>
  );
}

        <MoodPicker value={draft.mood} onChange={v=>setDraft({...draft, mood:v})} color={colors.mood} />
      </Field>

      <Field label="Refleksi bebas" color={colors.reflection} hint="Tulis apa saja yang ada di kepalamu, tanpa perlu rapi.">
        <textarea
          className="field-textarea"
          rows={5}
          placeholder="Hari ini terasa…"
          value={draft.reflection}
          onChange={e=>setDraft({...draft, reflection:e.target.value})}

      <Field label="Tiga hal yang disyukuri" color={colors.gratitude}>
        {[0,1,2].map(i => (

            className="field-input"

            value={draft.gratitude[i] || ''}

              setDraft({...draft, gratitude:g});

      <Field label="Catatan kegiatan" color={colors.activities} hint="Ringkasan hal-hal yang kamu lakukan hari ini.">
        <textarea
          className="field-textarea"
          rows={3}
          placeholder="Apa saja yang kamu lakukan hari ini?"
          value={draft.activities}

      <Field label="Tag" color="var(--ink-soft)">
        <TagInput tags={draft.tags} setTags={t=>setDraft({...draft, tags:t})} suggestions={allTags} color="var(--ink-soft)" />
      </Field>

      <div className="form-actions">
        <button className="btn-primary" onClick={handleSave}>
          {saved ? <><Check size={15}/> Tersimpan</> : (existing ? 'Perbarui catatan' : 'Simpan catatan')}

function HistoryView({ entries, colors, onEdit, allTags }){
  const [q, setQ] = useState('');
  const [tagFilter, setTagFilter] = useState('');
  const [moodFilter, setMoodFilter] = useState('');

  const filtered = useMemo(() => {
    return [...entries]
      .sort((a,b) => b.date.localeCompare(a.date))
      .filter(e => {
        if (tagFilter && !e.tags.includes(tagFilter)) return false;
        if (moodFilter && String(e.mood) !== moodFilter) return false;
        if (!q.trim()) return true;
        const hay = [e.reflection, e.activities, ...(e.gratitude||[]), ...(e.tags||[])].join(' ').toLowerCase();
        return hay.includes(q.toLowerCase());
      });
  }, [entries, q, tagFilter, moodFilter]);

  return (
    <div className="view">
      <div className="view-header">
        <div>
          <div className="view-eyebrow"><BreathDot/> Riwayat</div>
          <h1>Semua catatanmu</h1>
        </div>
      </div>

      <div className="history-controls">
        <div className="search-box">
          <Search size={15} />
          <input placeholder="Cari kata, rasa syukur, kegiatan…" value={q} onChange={e=>setQ(e.target.value)} />
        </div>
        <select value={tagFilter} onChange={e=>setTagFilter(e.target.value)}>
          <option value="">Semua tag</option>
          {allTags.map(t => <option key={t} value={t}>#{t}</option>)}
        </select>
        <select value={moodFilter} onChange={e=>setMoodFilter(e.target.value)}>
          <option value="">Semua rasa</option>
          {MOOD_LABELS.map((l,i) => <option key={l} value={i+1}>{l}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <div className="empty-state">
          <p>Belum ada catatan yang cocok.</p>
          <span>Coba ubah kata kunci atau filter, atau mulai menulis di tab Hari Ini.</span>
        </div>
      ) : (
        <ul className="entry-list">
          {filtered.map(e => (
            <li key={e.id} className="entry-item" onClick={()=>onEdit(e.date)}>
              <span className="entry-mood" style={{ background: colors.mood, opacity: e.mood ? MOOD_OPACITY[e.mood-1] : 0.15 }} />
              <div className="entry-item-body">
                <div className="entry-item-top">
                  <strong>{fmtShort(e.date)}</strong>
                  {e.mood && <span className="entry-item-moodlabel">{MOOD_LABELS[e.mood-1]}</span>}
                </div>
                {e.reflection && <p>{e.reflection.slice(0,140)}{e.reflection.length>140 ? '…' : ''}</p>}
                {e.tags?.length > 0 && (
                  <div className="entry-item-tags">
                    {e.tags.map(t => <span key={t}>#{t}</span>)}
                  </div>
                )}
              </div>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

function EvaluationView({ entries, colors, reviews, saveReview }){
  const now = new Date();
  const [type, setType] = useState('monthly');
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [quarter, setQuarter] = useState(getQuarter(now.getMonth()));
  const [half, setHalf] = useState(now.getMonth() < 6 ? 1 : 2);

  const period = type==='monthly' ? {type,year,month}
    : type==='quarterly' ? {type,year,quarter}
    : type==='half' ? {type,year,half}
    : {type,year};

  const key = periodKey(period);
  const periodEntries = useMemo(() => entries.filter(e => inPeriod(e.date, period)), [entries, period]);

  const avgMood = periodEntries.length
    ? (periodEntries.filter(e=>e.mood).reduce((s,e)=>s+e.mood,0) / (periodEntries.filter(e=>e.mood).length || 1))
    : 0;

  const tagCounts = useMemo(() => {
    const c = {};
    periodEntries.forEach(e => (e.tags||[]).forEach(t => c[t] = (c[t]||0)+1));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,6);
  }, [periodEntries]);

  const gratitudeHighlights = useMemo(() => {
    const all = periodEntries.flatMap(e => (e.gratitude||[]).filter(Boolean));
    return all.slice(-5).reverse();
  }, [periodEntries]);

  const moodByBucket = useMemo(() => {
    // bucket by week-of-period order, simple sequential grouping in chunks of up to 8 buckets
    const sorted = [...periodEntries].sort((a,b)=>a.date.localeCompare(b.date));
    const bucketCount = Math.min(8, Math.max(1, sorted.length));
    const size = Math.ceil(sorted.length / bucketCount) || 1;
    const buckets = [];
    for (let i=0;i<sorted.length;i+=size){
      const chunk = sorted.slice(i, i+size).filter(e=>e.mood);
      const avg = chunk.length ? chunk.reduce((s,e)=>s+e.mood,0)/chunk.length : 0;
      buckets.push(avg);
    }
    return buckets;
  }, [periodEntries]);

  const [reviewText, setReviewText] = useState(reviews[key] || '');
  useEffect(()=>{ setReviewText(reviews[key] || ''); }, [key, reviews]);

  const years = Array.from({length:7}, (_,i) => now.getFullYear() - 5 + i);

  return (
    <div className="view">
      <div className="view-header">
        <div>
          <div className="view-eyebrow"><BreathDot/> Evaluasi</div>
          <h1>Meninjau kembali perjalananmu</h1>
        </div>
      </div>

      <div className="eval-tabs">
        {[['monthly','Bulanan'],['quarterly','Per 3 Bulan'],['half','Tengah Tahun'],['yearly','Tahunan']].map(([k,l]) => (
          <button key={k} className={type===k ? 'is-active':''} onClick={()=>setType(k)}>{l}</button>
        ))}
      </div>

      <div className="eval-period-select">
        <select value={year} onChange={e=>setYear(Number(e.target.value))}>
          {years.map(y => <option key={y} value={y}>{y}</option>)}

          <select value={half} onChange={e=>setHalf(Number(e.target.value))}>

      {moodByBucket.length > 0 && (
        <div className="mini-chart" style={{ '--chart-color': colors.mood }}>
          {moodByBucket.map((v,i) => (
            <div key={i} className="mini-chart-bar" style={{ height: `${(v/5)*100 || 4}%` }} />

      {tagCounts.length > 0 && (

          <h3>Tag paling sering muncul</h3>

      )}

      {gratitudeHighlights.length > 0 && (
        <div className="eval-block" style={{ '--field-color': colors.gratitude }}>
          <h3>Sorotan rasa syukur</h3>
          <ul className="highlight-list">
            {gratitudeHighlights.map((g,i) => <li key={i}>{g}</li>)}
          </ul>
        </div>
      )}

      <Field label={`Catatan evaluasi — ${periodLabel(period)}`} color={colors.reflection} hint="Refleksikan pola, pencapaian, atau hal yang ingin diperbaiki pada periode ini.">
        <textarea
          className="field-textarea"
          rows={5}
          placeholder="Apa yang kamu pelajari dari periode ini?"
          value={reviewText}
          onChange={e=>setReviewText(e.target.value)}
          onBlur={()=>saveReview(key, reviewText)}
        />
      </Field>
    </div>
  );
}

function StatsView({ entries, colors }){
  const dateSet = useMemo(() => new Set(entries.map(e=>e.date)), [entries]);
  const streak = useMemo(() => currentStreak(dateSet), [dateSet]);
  const longest = useMemo(() => longestStreak([...dateSet]), [dateSet]);
  const avgWords = useMemo(() => {
    if (!entries.length) return 0;
    const total = entries.reduce((s,e) => s + wordCount(e.reflection) + wordCount(e.activities) + (e.gratitude||[]).reduce((a,g)=>a+wordCount(g),0), 0);
    return Math.round(total / entries.length);
  }, [entries]);
  const moodDist = useMemo(() => {
    const c = [0,0,0,0,0];
    entries.forEach(e => { if (e.mood) c[e.mood-1]++; });
    return c;
  }, [entries]);
  const maxMood = Math.max(1, ...moodDist);
  const tagDist = useMemo(() => {
    const c = {};
    entries.forEach(e => (e.tags||[]).forEach(t => c[t] = (c[t]||0)+1));
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).slice(0,8);
  }, [entries]);
  const maxTag = Math.max(1, ...tagDist.map(t=>t[1]));

  return (
    <div className="view">
      <div className="view-header">
        <div>
          <div className="view-eyebrow"><BreathDot/> Statistik</div>
          <h1>Kebiasaan menulismu</h1>
        </div>
      </div>

      <div className="eval-stat-row">
        <div className="stat-card"><span className="stat-num">{entries.length}</span><span>Total catatan</span></div>
        <div className="stat-card"><span className="stat-num">{streak}</span><span>Runtutan saat ini (hari)</span></div>
        <div className="stat-card"><span className="stat-num">{longest}</span><span>Runtutan terpanjang (hari)</span></div>
        <div className="stat-card"><span className="stat-num">{avgWords}</span><span>Rata-rata kata / catatan</span></div>
      </div>

      <div className="eval-block">
        <h3>Sebaran rasa</h3>
        <div className="dist-rows">
          {MOOD_LABELS.map((l,i) => (
            <div className="dist-row" key={l}>
              <span className="dist-label">{l}</span>
              <div className="dist-track">
                <div className="dist-fill" style={{ width: `${(moodDist[i]/maxMood)*100}%`, background: colors.mood, opacity: MOOD_OPACITY[i] }} />
              </div>
              <span className="dist-count">{moodDist[i]}</span>
            </div>
          ))}
        </div>
      </div>

      {tagDist.length > 0 && (
        <div className="eval-block">
          <h3>Tag terpopuler</h3>
          <div className="dist-rows">
            {tagDist.map(([t,c]) => (
              <div className="dist-row" key={t}>
                <span className="dist-label">#{t}</span>
                <div className="dist-track">
                  <div className="dist-fill" style={{ width: `${(c/maxTag)*100}%`, background: colors.activities }} />
                </div>
                <span className="dist-count">{c}</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function AppreciationView({ entries, colors }){
  const dateSet = useMemo(() => new Set(entries.map(e=>e.date)), [entries]);
  const t = todayISO();
  const now = new Date();

  const weekCount = entries.filter(e => daysBetween(e.date, t) >= 0 && daysBetween(e.date, t) < 7).length;
  const monthCount = entries.filter(e => { const d=parseISODate(e.date); return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth(); }).length;
  const yearCount = entries.filter(e => parseISODate(e.date).getFullYear() === now.getFullYear()).length;
  const longest = longestStreak([...dateSet]);
  const totals = { total: entries.length, longest };

  const daily = dateSet.has(t)
    ? { title:'Hari ini', msg:'Kamu meluangkan waktu untuk mencatat rasa hari ini. Itu bukan hal kecil.' }
    : { title:'Hari ini', msg:'Belum ada catatan hari ini — tidak apa-apa. Masih ada waktu, atau besok adalah kesempatan baru.' };

  const weekly = { title:'Minggu ini', msg:
    weekCount>=7 ? 'Tujuh hari penuh, konsistensi yang luar biasa.' :
    weekCount>=5 ? `${weekCount} catatan minggu ini — kamu sedang membangun kebiasaan yang baik.` :
    weekCount>=1 ? `${weekCount} catatan minggu ini. Setiap catatan tetap berarti.` :
    'Belum ada catatan minggu ini. Satu kalimat saja sudah cukup untuk memulai.'
  };

  const monthly = { title: `Bulan ${MONTHS_ID[now.getMonth()]}`, msg:
    monthCount>=20 ? `${monthCount} catatan bulan ini — kamu sangat konsisten.` :
    monthCount>=8 ? `${monthCount} catatan bulan ini, langkah yang stabil.` :
    monthCount>=1 ? `${monthCount} catatan bulan ini. Terus lanjutkan sesuai ritmemu.` :
    'Belum ada catatan bulan ini. Tidak apa, mulai dari hari ini juga bisa.'
  };

  const yearly = { title: `Tahun ${now.getFullYear()}`, msg:
    yearCount>=200 ? `${yearCount} catatan tahun ini — perjalanan reflektif yang panjang.` :
    yearCount>=50 ? `${yearCount} catatan tahun ini, sebuah kebiasaan yang mengakar.` :
    yearCount>=1 ? `${yearCount} catatan tahun ini. Setiap satu catatan adalah jejak rasa yang tersimpan.` :
    'Tahun ini baru dimulai — belum ada catatan, dan itu boleh saja.'
  };

  return (
    <div className="view">
      <div className="view-header">
        <div>
          <div className="view-eyebrow"><BreathDot/> Apresiasi</div>
          <h1>Untuk dirimu, yang sudah berusaha</h1>
        </div>
      </div>

      <div className="appreciation-grid">
        {[daily, weekly, monthly, yearly].map(a => (
          <div className="appreciation-card" key={a.title} style={{ '--field-color': colors.gratitude }}>
            <span className="appreciation-eyebrow">{a.title}</span>
            <p>{a.msg}</p>
          </div>
        ))}
      </div>

      <div className="eval-block">
        <h3>Pencapaian</h3>
        <ul className="achievement-list">
          {ACHIEVEMENTS.map(a => {
            const done = a.test(totals);
            return (
              <li key={a.id} className={done ? 'is-done' : ''}>
                <span className="achievement-dot" style={{ background: done ? colors.gratitude : 'var(--line)' }} />
                <div>
                  <strong>{a.label}</strong>
                  <span>{a.desc}</span>
                </div>
                {done && <Check size={16} />}
              </li>
            );
          })}
        </ul>
      </div>
    </div>
  );
}

        .achievement-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
        .achievement-list li { display:flex; align-items:center; gap:12px; opacity: .55; }
        .achievement-list li.is-done { opacity: 1; }
        .achievement-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
        .achievement-list li div { display:flex; flex-direction:column; flex:1; }
        .achievement-list li strong { font-size: 14px; }
        .achievement-list li span { font-size: 12.5px; color: var(--ink-soft); }
        .achievement-list li svg { color: var(--gold); }

        .settings-hint { font-size: 13px; color: var(--ink-soft); margin: -6px 0 0; }
        .color-grid { display:grid; grid-template-columns: repeat(2,1fr); gap: 12px; }
        .color-row { display:flex; align-items:center; justify-content:space-between; gap:10px; font-size: 13.5px; background: var(--paper); border:1px solid var(--line); border-radius:10px; padding: 10px 12px; }
        .color-row input[type=color] { width:34px; height:28px; border:none; background:none; cursor:pointer; padding:0; }
        .color-row input[type=time] { border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:'IBM Plex Mono',monospace; }
        .danger-zone { border-color: #E4C2B8; }

        .reminder-banner { display:flex; align-items:center; justify-content:space-between; gap:12px; background: var(--surface); border:1px solid var(--gold); border-radius: var(--radius); padding: 12px 16px; font-size: 13.5px; }
        .reminder-banner button { border:none; background:none; cursor:pointer; color: var(--ink-soft); }

        @media (max-width: 780px) {
          .journal-app { flex-direction: column; }
          .sidebar { width:100%; flex-direction:row; overflow-x:auto; padding: 12px; border-right:none; border-bottom:1px solid var(--line); }
          .sidebar-brand { display:none; }
          .nav-btn { flex-direction:column; gap:4px; font-size:11px; padding:8px 10px; white-space:nowrap; }
          .main { padding: 24px 18px 60px; }
          .appreciation-grid { grid-template-columns: 1fr; }
          .color-grid { grid-template-columns: 1fr; }
        }

        .sidebar-user { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
        .sidebar-user > span { font-size: 11.5px; color: var(--ink-soft); padding: 0 12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

        .auth-app { align-items:center; justify-content:center; padding: 20px; }
        .auth-card { width: 100%; max-width: 380px; background: var(--surface); border:1px solid var(--line); border-radius: var(--radius); padding: 32px 30px; margin: auto; }
        .auth-card h1 { font-size: 22px; margin-bottom: 18px; }
        .auth-form { display:flex; flex-direction:column; gap:14px; }
        .auth-form label { display:flex; flex-direction:column; gap:6px; font-size: 13.5px; color: var(--ink-soft); }
        .auth-error { color: #A85B48; font-size: 13px; margin: 0; }
        .auth-info { color: var(--sage); font-size: 13px; margin: 0; }
    `}</style>
  );
}


function AuthView(){
  const [mode, setMode] = useState('login');
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [info, setInfo] = useState('');
  const [loading, setLoading] = useState(false);

  const submit = async (e) => {
    e.preventDefault();
    setError(''); setInfo(''); setLoading(true);
    try {
      if (mode === 'login') {
        const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (err) throw err;
      } else {
        const { error: err } = await supabaseClient.auth.signUp({ email, password });
        if (err) throw err;
        setInfo('Akun berhasil dibuat. Cek email kamu untuk verifikasi, lalu masuk.');
      }
    } catch (err) {
      setError(err.message || 'Terjadi kesalahan, coba lagi.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="journal-app auth-app">
      <AppStyles />
      <div className="auth-card">
        <div className="sidebar-brand" style={{ padding: 0, marginBottom: 22 }}>
          Rasa<span>ruang hening untuk mencatat rasa</span>
        </div>
        <h1>{mode === 'login' ? 'Masuk ke jurnalmu' : 'Buat akun baru'}</h1>
        <form onSubmit={submit} className="auth-form">
          <label>
            Email
            <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="nama@email.com" className="field-input" />
          </label>
          <label>
            Kata sandi
            <input type="password" required minLength={6} value={password} onChange={e=>setPassword(e.target.value)} placeholder="minimal 6 karakter" className="field-input" />
          </label>
          {error && <p className="auth-error">{error}</p>}
          {info && <p className="auth-info">{info}</p>}
          <button className="btn-primary" type="submit" disabled={loading} style={{ justifyContent: 'center' }}>
            {loading ? 'Memproses…' : (mode === 'login' ? 'Masuk' : 'Daftar')}
          </button>
        </form>
        <button className="btn-ghost" style={{ marginTop: 14 }} onClick={()=>{ setMode(mode==='login'?'signup':'login'); setError(''); setInfo(''); }}>
          {mode === 'login' ? 'Belum punya akun? Daftar di sini' : 'Sudah punya akun? Masuk'}
        </button>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App utama                                                           */
/* ------------------------------------------------------------------ */

function App(){
  const [session, setSession] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [loading, setLoading] = useState(true);
  const [entries, setEntries] = useState([]);
  const [reviews, setReviews] = useState({});
  const [settings, setSettingsState] = useState({ colors: DEFAULT_COLORS, reminderTime: '' });
  const [tab, setTab] = useState('today');
  const [draftDate, setDraftDate] = useState(todayISO());
  const [reminderDismissed, setReminderDismissed] = useState(false);

  useEffect(() => {
    supabaseClient.auth.getSession().then(({ data }) => {
      setSession(data.session);
      setAuthChecked(true);
    });
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    return () => listener.subscription.unsubscribe();
  }, []);

  useEffect(() => {
    if (!session) { setLoading(false); return; }
    (async () => {
      setLoading(true);
      const uid = session.user.id;

      const { data: entryRows } = await supabaseClient.from('entries').select('*').eq('user_id', uid).order('date');
      setEntries((entryRows || []).map(r => ({
        id: r.id, date: r.date, mood: r.mood, reflection: r.reflection || '',
        gratitude: r.gratitude || ['', '', ''], activities: r.activities || '', tags: r.tags || [],
      })));

      const { data: reviewRows } = await supabaseClient.from('reviews').select('*').eq('user_id', uid);
      const reviewMap = {};
      (reviewRows || []).forEach(r => { reviewMap[r.period_key] = r.text; });
      setReviews(reviewMap);

      const { data: settingsRow } = await supabaseClient.from('settings').select('*').eq('user_id', uid).maybeSingle();
      setSettingsState(settingsRow
        ? { colors: settingsRow.colors || DEFAULT_COLORS, reminderTime: settingsRow.reminder_time || '' }
        : { colors: DEFAULT_COLORS, reminderTime: '' });

      setLoading(false);
    })();
  }, [session]);

  const saveEntry = useCallback(async (entry) => {
    if (!session) return;
    const uid = session.user.id;
    const row = {
      user_id: uid, date: entry.date, mood: entry.mood, reflection: entry.reflection,
      gratitude: entry.gratitude, activities: entry.activities, tags: entry.tags,
    };
    const { data, error } = await supabaseClient.from('entries').upsert(row, { onConflict: 'user_id,date' }).select().single();
    if (!error && data) {
      setEntries(prev => [...prev.filter(e => e.date !== entry.date), {
        id: data.id, date: data.date, mood: data.mood, reflection: data.reflection || '',
        gratitude: data.gratitude || ['', '', ''], activities: data.activities || '', tags: data.tags || [],
      }]);
    }
  }, [session]);

  const deleteEntry = useCallback(async (id) => {
    if (!session) return;
    await supabaseClient.from('entries').delete().eq('id', id);
    setEntries(prev => prev.filter(e => e.id !== id));
  }, [session]);

  const saveReview = useCallback(async (key, text) => {
    if (!session) return;
    const uid = session.user.id;
    await supabaseClient.from('reviews').upsert({ user_id: uid, period_key: key, text }, { onConflict: 'user_id,period_key' });
    setReviews(prev => ({ ...prev, [key]: text }));
  }, [session]);

  const setSettings = useCallback(async (next) => {
    if (!session) return;
    const uid = session.user.id;
    await supabaseClient.from('settings').upsert({ user_id: uid, colors: next.colors, reminder_time: next.reminderTime }, { onConflict: 'user_id' });
    setSettingsState(next);
  }, [session]);

  const resetAll = useCallback(async () => {
    if (!session) return;
    if (!window.confirm('Yakin ingin menghapus semua catatan dan pengaturan? Tindakan ini tidak bisa dibatalkan.')) return;
    const uid = session.user.id;
    await supabaseClient.from('entries').delete().eq('user_id', uid);
    await supabaseClient.from('reviews').delete().eq('user_id', uid);
    await supabaseClient.from('settings').delete().eq('user_id', uid);
    setEntries([]); setReviews({}); setSettingsState({ colors: DEFAULT_COLORS, reminderTime: '' });
  }, [session]);

  const handleLogout = useCallback(async () => { await supabaseClient.auth.signOut(); }, []);


  const allTags = useMemo(() => {
    const s = new Set();
    entries.forEach(e => (e.tags||[]).forEach(t => s.add(t)));
    return [...s].sort();
  }, [entries]);

  const goEdit = useCallback((date) => { setDraftDate(date); setTab('today'); }, []);

  const nowTime = new Date();
  const hasToday = entries.some(e => e.date === todayISO());
  const showReminder = settings.reminderTime && !hasToday && !reminderDismissed && tab==='today' &&
    `${pad2(nowTime.getHours())}:${pad2(nowTime.getMinutes())}` >= settings.reminderTime;

  const NAV = [
    ['today','Hari Ini', BookOpen],
    ['history','Riwayat', CalendarDays],
    ['eval','Evaluasi', Feather],
    ['stats','Statistik', BarChart2],
    ['appreciation','Apresiasi', Heart],
    ['settings','Pengaturan', SettingsIcon],
  ];

  if (!authChecked) {
    return <div style={{ minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center', fontFamily:'sans-serif', color:'#6E6A5C' }}>Memuat…</div>;
  }
  if (!session) {
    return <AuthView />;
  }

  return (
    <div className="journal-app">
      <AppStyles />

      <aside className="sidebar">
        <div className="sidebar-brand">
          Rasa
          <span>ruang hening untuk mencatat rasa</span>
        </div>
        {NAV.map(([key,label,Icon]) => (
          <button key={key} className={`nav-btn ${tab===key ? 'is-active':''}`} onClick={()=>setTab(key)}>
            <Icon size={16} /> {label}
          </button>
        ))}
        <div className="sidebar-user">
          <span title={session.user.email}>{session.user.email}</span>
          <button className="nav-btn" onClick={handleLogout}><LogOut size={16}/> Keluar</button>
        </div>
      </aside>

      <main className="main">
        {loading ? (
          <p style={{ color: 'var(--ink-soft)' }}>Memuat catatanmu…</p>
        ) : (
          <>
            {showReminder && (
              <div className="reminder-banner" style={{ marginBottom: 20 }}>
                <span>Sudah menulis jurnal hari ini? Luangkan waktu sejenak untuk dirimu.</span>
                <button onClick={()=>setReminderDismissed(true)}><X size={16}/></button>
              </div>
            )}
            {tab==='today' && <TodayView entries={entries} saveEntry={saveEntry} deleteEntry={deleteEntry} colors={settings.colors} allTags={allTags} draftDate={draftDate} setDraftDate={setDraftDate} />}
            {tab==='history' && <HistoryView entries={entries} colors={settings.colors} onEdit={goEdit} allTags={allTags} />}
            {tab==='eval' && <EvaluationView entries={entries} colors={settings.colors} reviews={reviews} saveReview={saveReview} />}
            {tab==='stats' && <StatsView entries={entries} colors={settings.colors} />}
            {tab==='appreciation' && <AppreciationView entries={entries} colors={settings.colors} />}
            {tab==='settings' && <SettingsView settings={settings} setSettings={setSettings} onReset={resetAll} />}
          </>
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
